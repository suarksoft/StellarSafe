<!DOCTYPE html>
<html>
<head>
    <title>Freighter Test</title>
    <!-- ZORUNLU: Freighter API CDN Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-freighter-api/5.0.0/index.min.js"></script>
    <style>
        body {
            font-family: system-ui;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .status {
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button {
            background: #5B21B6;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #6D28D9; }
    </style>
</head>
<body>
    <h1>🚀 Freighter Test Page</h1>
    
    <div id="status"></div>
    
    <button onclick="checkFreighter()">Check Freighter</button>
    <button onclick="requestPermission()">Request Permission</button>
    <button onclick="testConnection()">Test Connection</button>
    
    <script>
        function updateStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.className = 'status ' + (isError ? 'error' : 'success');
            status.innerHTML = message;
        }
        
        function checkFreighter() {
            console.log('Checking Freighter...');
            
            if (window.freighterApi) {
                updateStatus('✅ Freighter API FOUND!<br>window.freighterApi exists');
                console.log('Freighter API:', window.freighterApi);
            } else {
                updateStatus('❌ Freighter API NOT FOUND<br><br>' +
                    'Possible reasons:<br>' +
                    '1. Freighter not installed<br>' +
                    '2. Site access permission not granted<br>' +
                    '3. Extension disabled<br><br>' +
                    '<b>Solution:</b><br>' +
                    '1. Right-click Freighter icon → Manage Extension<br>' +
                    '2. Set "Site access" to "On all sites"<br>' +
                    '3. Refresh this page', true);
            }
        }
        
        async function requestPermission() {
            if (!window.freighterApi) {
                updateStatus('❌ Freighter API not available. Check site permissions!', true);
                return;
            }
            
            try {
                const { isAllowed } = await window.freighterApi.isAllowed();
                if (isAllowed) {
                    updateStatus('✅ Permission already granted!');
                } else {
                    await window.freighterApi.setAllowed();
                    updateStatus('✅ Permission granted!');
                }
            } catch (error) {
                updateStatus('❌ Error: ' + error.message, true);
            }
        }
        
        async function testConnection() {
            if (!window.freighterApi) {
                updateStatus('❌ Freighter API not available', true);
                return;
            }
            
            try {
                const { address } = await window.freighterApi.getAddress();
                const { network } = await window.freighterApi.getNetwork();
                
                updateStatus(
                    '✅ Connection SUCCESS!<br><br>' +
                    '<b>Public Key:</b> ' + address + '<br>' +
                    '<b>Network:</b> ' + network
                );
            } catch (error) {
                updateStatus('❌ Connection failed: ' + error.message, true);
            }
        }
        
        // Auto-check on load
        window.addEventListener('load', () => {
            setTimeout(checkFreighter, 500);
        });
    </script>
</body>
</html>
